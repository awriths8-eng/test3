name: "CodeQL Advanced"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '19 13 * * 6'
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended, security-and-quality, security-experimental

    # 手動編譯步驟：因為專案沒有 Makefile / CMake，直接用 gcc 編譯
    - name: Build
      run: |
        gcc -c main.c -o main.o

    # 1. 執行 CodeQL 分析，並指定 output 輸出路徑
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        # 👇 關鍵新增這行：指定 SARIF 產出資料夾
        output: '${{ github.workspace }}/sarif-results'

    # 2. 上傳產出的 SARIF 檔案
    - name: Upload SARIF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: codeql-sarif-report
        # 👇 讀取剛才產出的資料夾
        path: ${{ github.workspace }}/sarif-results/*.sarif
